name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The two platforms Portillo.Dots declares as supported. Windows is
        # explicitly out of scope; see docs/platforms.md.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan inspects history blobs, so a shallow clone would
          # silently check nothing.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh luajit shellcheck rsync

      - name: Install validation tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zsh luajit shellcheck rsync

      - name: Unit and integration tests
        run: python -B -m unittest discover -s tests -v

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint every tracked shell file
        run: python -B -m unittest discover -s tests -p 'test_shellcheck.py' -v

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan tracked content and history
        run: python -B -m unittest discover -s tests -p 'test_security.py' -v
