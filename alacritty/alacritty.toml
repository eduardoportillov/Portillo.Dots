# --- 1. VENTANA Y ESTÉTICA ---
[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 0.95
blur = true
decorations = "full"
startup_mode = "Windowed"

# --- 2. FUENTES (Hack Nerd Font) ---
[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

# --- 3. CURSOR ---
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_timeout = 10

# --- 4. COLORES (Tokyo Night Storm) ---
[colors.primary]
background = "#1a1b26"
foreground = "#e8e8f0"

[colors.normal]
black =   "#15161e"
red =     "#f7768e"
green =   "#9ece6a"
yellow =  "#e0af68"
blue =    "#5b9cf5"
magenta = "#bb9af7"
cyan =    "#5dcfe9"
white =   "#a9b1d6"

[colors.bright]
black =   "#414868"
red =     "#f7768e"
green =   "#9ece6a"
yellow =  "#e0af68"
blue =    "#89b4ff"
magenta = "#bb9af7"
cyan =    "#7dd9ff"
white =   "#c0caf5"

# --- 5. SELECCIÓN ---
[selection]
save_to_clipboard = true

# --- 6. HINTS (URLs - portable macOS/Linux) ---
[hints]
alphabet = "jkhlndfsaugcvmoweyri"

[[hints.enabled]]
command = { program = "sh", args = ["-c", "uname -s | grep -q Darwin && open -R '{hint}' || xdg-open '{hint}'"] }
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = true, mods = "Command" }
binding = { key = "Space", mods = "Shift" }

# --- 7. RENDIMIENTO Y ENTORNO ---
[env]
TERM = "xterm-256color"

[scrolling]
history = 10000
multiplier = 3

[terminal]
shell = { program = "/bin/zsh", args = ["--login"] }

# --- 8. BELL ---
[bell]
animation = "EaseOutExpo"
duration = 0

# --- 9. KEYBINDINGS ---
[keyboard]
bindings = [
    { key = "Enter", mods = "Control", chars = "\u001b[13;5u" },
    { key = "Enter", mods = "Shift",   chars = "\u001b[13;2u" },
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0",   mods = "Control", action = "ResetFontSize" },
   
    # Saltar palabras con Alt + Flecha Izquierda/Derecha
    { key = "Left",  mods = "Alt",   chars = "\u001bb" },
    { key = "Right", mods = "Alt",   chars = "\u001bf" },

    # Borrar palabra completa con Alt + Backspace (Opcional pero muy útil)
    { key = "Back",  mods = "Alt",   chars = "\u001b\u007f" },
]
