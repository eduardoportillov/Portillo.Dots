# =============================================================
#   ALACRITTY CONFIG — Linux
# =============================================================

# --- VENTANA Y ESTÉTICA ---
[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
opacity = 1.0
blur = true          # Requiere compositor con soporte (Picom, KWin, etc.)
decorations = "full" # En tiling WMs (i3, bspwm) considera cambiar a "None"
startup_mode = "Windowed"

# --- FUENTES (Hack Nerd Font) ---
[font]
size = 12.0

[font.normal]
family = "Hack Nerd Font"
style = "Regular"

[font.bold]
family = "Hack Nerd Font"
style = "Bold"

[font.italic]
family = "Hack Nerd Font"
style = "Italic"

[font.bold_italic]
family = "Hack Nerd Font"
style = "Bold Italic"

# --- CURSOR ---
[cursor]
style = { shape = "Beam", blinking = "On" }
blink_timeout = 10

# --- COLORES (Tokyo Night Storm) ---
[colors.primary]
background = "#17171b"
foreground = "#e6eef6"

[colors.selection]
background = "#2b2f35"
text = "#e6eef6"

[colors.normal]
black =   "#0f1114"
red =     "#ff7b92"
green =   "#9ef08a"
yellow =  "#ffd580"
blue =    "#7aa2ff"
magenta = "#c79bff"
cyan =    "#6be7e0"
white =   "#cfd8ea"

[colors.bright]
black =   "#5a6574"
red =     "#ff92b0"
green =   "#b4f09a"
yellow =  "#ffe6a0"
blue =    "#89b4ff"
magenta = "#d6b8ff"
cyan =    "#8fefff"
white =   "#e8f0ff"

# --- SELECCIÓN ---
[selection]
save_to_clipboard = true

# --- HINTS ---
[hints]
alphabet = "jkhlndfsaugcvmoweyri"

[[hints.enabled]]
command = { program = "xdg-open", args = ["{hint}"] }
hyperlinks = true
post_processing = true
persist = false
mouse = { enabled = false, mods = "None" }
binding = { key = "F24", mods = "Control|Shift" }

# --- RENDIMIENTO Y ENTORNO ---
[env]
TERM = "xterm-256color"

[scrolling]
history = 10000
multiplier = 3

[terminal]
shell = { program = "/home/linuxbrew/.linuxbrew/bin/zsh", args = ["--login"] }

# --- BELL ---
[bell]
animation = "EaseOutExpo"
duration = 0

# --- KEYBINDINGS ---
[keyboard]
bindings = [
    { key = "Enter", mods = "Control", chars = "\u001b[13;5u" },
    { key = "Enter", mods = "Shift",   chars = "\u001b\r" },
    { key = "Enter", mods = "Alt",     chars = "\u001b\r" },

    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "Equals", mods = "Control", action = "IncreaseFontSize" },
    { key = "Minus",  mods = "Control", action = "DecreaseFontSize" },
    { key = "Key0",   mods = "Control", action = "ResetFontSize" },

    # Abrir directorio actual en el gestor de archivos
    { key = "O", mods = "Control|Shift", chars = "xdg-open .\r" },

    # Saltar palabras con Alt + Flecha Izquierda/Derecha
    { key = "Left",  mods = "Alt", chars = "\u001bb" },
    { key = "Right", mods = "Alt", chars = "\u001bf" },

    # Borrar palabra completa con Alt + Backspace
    { key = "Back",  mods = "Alt", chars = "\u001b\u007f" },
    { key = "Return", mods = "Shift", chars = "\u001B\r" },
]
