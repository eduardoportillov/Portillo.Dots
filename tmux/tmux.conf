# Carga TPM
set -g @plugin 'tmux-plugins/tpm'

# Tested options for TMUX compatibility
set -g @plugin 'tmux-plugins/tmux-sensible'

# Clipboard management
set -g @plugin 'tmux-plugins/tmux-yank'

# Tmux Navigation
set -g @plugin 'christoomey/vim-tmux-navigator'

# Tmux Resurrect
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Programas a re-lanzar al restaurar (además de la whitelist por defecto:
# vim/nvim/less/top...). "~claude" hace match "empieza con" → claude, claude -c, etc.
# Nota: solo re-ejecuta el comando; no recupera el estado interno del programa.
set -g @resurrect-processes 'opencode "~claude"'

# Which Key
set -g @plugin 'alexwforsythe/tmux-which-key'

# Extrakto: extracción difusa de texto (rutas, URLs, hashes) del scrollback con fzf.
# Uso: <prefix> + Tab → popup fzf. Requiere fzf (instalado).
set -g @plugin 'laktak/extrakto'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Tema Kanagawa
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins "git cpu-usage ram-usage"
set -g @kanagawa-ignore-window-colors true

# Tmux Continuum: auto-guardado + auto-restauración de sesiones.
# DEBE ir después de resurrect (depende de él) y DESPUÉS del tema kanagawa:
# continuum antepone su hook de auto-save a `status-right`, y kanagawa sobrescribe
# `status-right` al cargar; si continuum carga antes, el tema borra el hook y el
# auto-save deja de funcionar. Cargándolo al final, su hook sobrevive.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
# Ventana en la que continuum considera "recién arrancado" el server para
# auto-restaurar (default 10s). Subida a 60s por resiliencia ante boots lentos.
# Nota: NO basta contra un salto de reloj grande tras arrancar tmux; para eso
# está el ExecStartPre en linux/tmux.service.d/continuum-autoboot-fixes.conf que espera al sync.
set -g @continuum-restore-max-delay '60'
# Autoboot: continuum genera/habilita ~/.config/systemd/user/tmux.service para
# levantar tmux al iniciar sesión.
# REQUISITO: el drop-in linux/tmux.service.d/continuum-autoboot-fixes.conf (desplegado por
# setup.sh) inyecta /home/linuxbrew/.linuxbrew/bin en el PATH del servicio.
# Sin él, el server arranca con un PATH donde TPM no encuentra `tmux` (binario
# de Homebrew) y NO carga plugins (sin tema ni auto-restore).
set -g @continuum-boot 'on'

# --- terminal & key handling ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Clipboard end-to-end: OSC 52 desde apps (Claude Code, etc.) → buffer tmux
# → terminal externo (Alacritty con osc52=OnlyCopy) → system clipboard.
# Permite Ctrl+V en otras apps sin necesidad de prefix+].
set -g set-clipboard on
set -g allow-passthrough on

set -s extended-keys off

# Modo vim
set -g mode-keys vi
if-shell 'uname | grep -q Darwin' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reordenar ventanas con Alt+←/→ (foco sigue a la ventana, wrap en extremos)
bind -n M-Left  run-shell 'cur=$(tmux display-message -p "#I"); if [ "$cur" -gt 1 ]; then tmux swap-window -t -1; tmux select-window -t -1; else max=$(tmux display-message -p "#{session_windows}"); tmux swap-window -t "$max"; tmux select-window -t "$max"; fi'
bind -n M-Right run-shell 'cur=$(tmux display-message -p "#I"); max=$(tmux display-message -p "#{session_windows}"); if [ "$cur" -lt "$max" ]; then tmux swap-window -t +1; tmux select-window -t +1; else tmux swap-window -t 1; tmux select-window -t 1; fi'

# TPM init
run '~/.tmux/plugins/tpm/tpm'
