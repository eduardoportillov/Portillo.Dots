# Drop-in para el tmux.service que genera tmux-continuum (@continuum-boot 'on').
#
# Problema que resuelve: el servicio arranca tmux con el PATH del gestor systemd
# de usuario, que NO incluye /home/linuxbrew/.linuxbrew/bin (donde vive el binario
# `tmux` de Homebrew). TPM y sus plugins llaman a `tmux` por nombre → "command not
# found" → no se cargan plugins (kanagawa sin tema, continuum sin auto-restore) y
# el server queda a medio inicializar.
#
# El drop-in inyecta un PATH con linuxbrew al frente. systemd lo fusiona con el
# unit que genera continuum, y sobrevive a que continuum regenere el unit (solo
# escribe el unit principal "si no existe"; nunca toca este directorio .d/).
#
# Desplegado por setup.sh a ~/.config/systemd/user/tmux.service.d/10-path.conf
[Service]
Environment=PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
