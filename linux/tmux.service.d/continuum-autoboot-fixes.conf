# Drop-in para el tmux.service que genera tmux-continuum (@continuum-boot 'on').
#
# Problema que resuelve: el servicio arranca tmux con el PATH del gestor systemd
# de usuario, que NO incluye /home/linuxbrew/.linuxbrew/bin (donde vive el binario
# `tmux` de Homebrew). TPM y sus plugins llaman a `tmux` por nombre → "command not
# found" → no se cargan plugins (kanagawa sin tema, continuum sin auto-restore) y
# el server queda a medio inicializar.
#
# El drop-in inyecta un PATH con linuxbrew al frente. systemd lo fusiona con el
# unit que genera continuum, y sobrevive a que continuum regenere el unit (solo
# escribe el unit principal "si no existe"; nunca toca este directorio .d/).
#
# Segundo problema que resuelve (ExecStartPre): si el reloj del sistema arranca
# desfasado (RTC atrasado) y chronyd lo corrige con un `makestep` JUSTO DESPUÉS
# de que tmux ya arrancó, tmux graba su #{start_time} contra el reloj viejo. Al
# saltar el reloj adelante, continuum ve el server "iniciado hace X días" → su
# ventana `@continuum-restore-max-delay` falla → NO auto-restaura. La espera
# acotada a la sincronización del reloj hace que tmux arranque ya con la hora
# correcta. Timeout de 60s para no colgar el boot si no hay red (siempre exit 0);
# margen amplio para que el makestep de chrony caiga dentro de la espera.
#
# Desplegado por setup.sh a ~/.config/systemd/user/tmux.service.d/continuum-autoboot-fixes.conf
[Service]
Environment=PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/usr/games:/usr/local/games:/snap/bin
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do [ "$(/usr/bin/timedatectl show -p NTPSynchronized --value)" = yes ] && exit 0; sleep 1; done; exit 0'
