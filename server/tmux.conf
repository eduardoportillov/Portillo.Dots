# Remote Server tmux: the shared baseline only — no TPM, autoboot, process
# resurrection or desktop clipboard plugins. The baseline lives in
# shared/tmux/base.conf and is deployed to
# ~/.config/portillo-dots/tmux-base.conf by setup.sh; the remote runtime
# copies the same file into its own config generation.
source-file ~/.config/portillo-dots/tmux-base.conf

# Server keeps the lightweight base unless explicitly enabled with
# setup.sh --profile server --tmux-visual. This overlay is visual only: no
# session resurrection, systemd service or autoboot.
if-shell 'test -r "$HOME/.config/portillo-dots/tmux-visual-enabled" && test -r "$HOME/.config/portillo-dots/tmux-visual.conf"' \
  'source-file ~/.config/portillo-dots/tmux-visual.conf'
