# Remote Server tmux: the shared baseline only — no TPM, autoboot, process
# resurrection or desktop clipboard plugins. The baseline lives in
# shared/tmux/base.conf and is deployed to
# ~/.config/portillo-dots/tmux-base.conf by setup.sh; the remote runtime
# copies the same file into its own config generation.
source-file ~/.config/portillo-dots/tmux-base.conf
