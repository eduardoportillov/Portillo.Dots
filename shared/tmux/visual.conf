# Optional tmux visual overlay for Server and remote sessions.
# Deliberately excludes resurrect, continuum, services and autoboot: it only
# loads TPM plus the Kanagawa Dragon theme and its git/CPU/RAM status modules.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'Nybkox/tmux-kanagawa'
set -g @kanagawa-theme 'dragon'
set -g @kanagawa-plugins 'git cpu-usage ram-usage'
set -g @kanagawa-ignore-window-colors true
run '~/.tmux/plugins/tpm/tpm'
