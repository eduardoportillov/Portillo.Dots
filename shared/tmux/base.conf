# Portillo.Dots shared tmux baseline: terminal, keymaps and status behavior
# identical on every host. Both tmux/tmux.conf (workstation, plugin stack on
# top) and server/tmux.conf (baseline only) source this file, so a session
# behaves the same wherever it runs. The palette matches the shared shell
# prompt (Kanagawa Dragon).

# --- terminal & key handling ---
# Refresh graphical connection metadata when attaching after a new login.
set -g update-environment "DISPLAY KRB5CCNAME MSYSTEM SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY WAYLAND_DISPLAY XDG_SESSION_TYPE XDG_RUNTIME_DIR"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Clipboard end-to-end: OSC 52 desde apps (Claude Code, etc.) → buffer tmux
# → terminal externo (Alacritty con osc52=OnlyCopy) → system clipboard.
# Permite Ctrl+V en otras apps sin necesidad de prefix+].
set -g set-clipboard on
set -g allow-passthrough on

set -s extended-keys off

# Modo vim
set -g mode-keys vi
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
if-shell 'test "$(uname)" = Darwin && command -v pbcopy' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"'
if-shell 'test "$(uname)" = Linux && test -n "$DISPLAY" && command -v xclip' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"'
if-shell 'test "$(uname)" = Linux && test -n "$WAYLAND_DISPLAY" && command -v wl-copy' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"'

# Keymaps
unbind C-b
set -g prefix C-a
bind C-a send-prefix

unbind %
unbind '"'
bind v split-window -h -c "#{pane_current_path}"
bind d split-window -v -c "#{pane_current_path}"

# Mouse support
set -g mouse on

# Status bar position
set -g status-position top

# Kill all sessions except current
bind K confirm-before -p "Kill all other sessions? (y/n)" "kill-session -a"

# Fix index
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Reordenar ventanas con Alt+←/→ (foco sigue a la ventana, wrap en extremos)
bind -n M-Left  run-shell 'cur=$(tmux display-message -p "#I"); if [ "$cur" -gt 1 ]; then tmux swap-window -t -1; tmux select-window -t -1; else max=$(tmux display-message -p "#{session_windows}"); tmux swap-window -t "$max"; tmux select-window -t "$max"; fi'
bind -n M-Right run-shell 'cur=$(tmux display-message -p "#I"); max=$(tmux display-message -p "#{session_windows}"); if [ "$cur" -lt "$max" ]; then tmux swap-window -t +1; tmux select-window -t +1; else tmux swap-window -t 1; tmux select-window -t 1; fi'

# Floating window
bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' {
  detach-client
} {
  # open in the same directory of the current pane
  display-popup -d "#{pane_current_path}" -E "tmux new-session -A -s scratch"
}

# Kanagawa Dragon status (same palette as the shared shell prompt). A plugin
# theme loaded after this file may replace the styling.
set -g status-style "bg=#181616,fg=#c5c9c5"
set -g status-left "#[fg=#8ba4b0]#H #[default]"
set -g status-right "%Y-%m-%d %H:%M"
